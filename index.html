<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Usage by Industry</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anonymous+Pro&family=Inter:wght@600&display=swap');
:root{font-family:'Anonymous Pro',monospace;color:#080808;background:#fff;color-scheme:light}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff}main{max-width:1440px;margin:auto;padding:140px 67px 200px}h1,h2{font-family:Inter,Arial,sans-serif;letter-spacing:-.09em;line-height:1;font-weight:600;margin:0}h1{font-size:clamp(60px,8.9vw,128px);margin-bottom:135px}h2{font-size:clamp(70px,8.9vw,128px)}section{margin-bottom:150px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:65px}.sort button{font:24px 'Anonymous Pro',monospace;background:#fff;border:0;border-bottom:1px solid #bbb;padding:0 14px 12px;cursor:pointer}.sort button.active{border-bottom:6px solid #0052fe;padding-bottom:7px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:65px 20px}.card{text-align:center;min-width:0}.box{aspect-ratio:1;background:#0052fe;border-radius:24px;overflow:hidden}.box canvas{display:block;width:100%;height:100%}.value{font-size:24px;margin:17px 0 10px}.name{font-size:24px;line-height:1.15;overflow-wrap:anywhere}.motion{display:flex;align-items:center;gap:15px;margin:-75px 0 105px;font-size:17px}.motion button{font:inherit;color:white;background:#0052fe;border:0;border-radius:99px;padding:14px 20px;cursor:pointer}.motion button[hidden]{display:none}.note{margin-top:30px;font-size:18px;color:#555}@media(max-width:1100px){main{padding:75px 30px}.grid{grid-template-columns:repeat(4,1fr)}.head{align-items:start;flex-direction:column}.name,.value,.sort button{font-size:18px}}@media(max-width:650px){main{padding:55px 20px}.grid{grid-template-columns:repeat(2,1fr);gap:36px 12px}.box{border-radius:18px}.name,.value{font-size:15px}.sort button{font-size:14px;padding:0 7px 8px}.sort button.active{padding-bottom:3px}h1{font-size:57px;margin-bottom:100px}h2{font-size:72px}.motion{flex-direction:column;align-items:start;margin:-65px 0 70px;font-size:15px}.head{margin-bottom:35px}section{margin-bottom:100px}}
</style>
<main><h1>AI Usage in businesses<br>by industries</h1><div class="motion"><button id="tilt">Enable tilt control</button><span id="status" role="status">Tilt your device to move the stars.</span></div><div id="app"></div></main>
<script>
const data=[['Accommodation and Food Services',1.4,2],['Administrative and Support and Waste Management and Remediation Services',2.9,10.2],['Arts, Entertainment, and Recreation',4.1,6],['Construction',1,4.5],['Educational Services',5.9,17.3],['Finance and Insurance',4.7,17.1],['Health Care and Social Assistance',3.7,11.4],['Information Technology',13.9,29.3],['Manufacturing',1.8,4.6],['Other Services',1.9,4],['Professional, Scientific, and Technical Services',8.9,23.9],['Real Estate and Rental and Leasing',6.5,14.6],['Retail Trade',2.6,6.3],['Transportation and Warehousing',1.8,2.1],['Wholesale Trade',1.5,5.4]];
const starArt={white:new Image(),green:new Image()};starArt.white.src='dithered-star-white.svg';starArt.green.src='dithered-star-green.svg';
const app=document.getElementById('app'),button=document.getElementById('tilt'),status=document.getElementById('status'),g={x:0,y:.19},order={2023:0,2025:0};let boxes=[];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
if(!('DeviceOrientationEvent' in window)){button.hidden=true;status.textContent='Stars fall automatically on this device.'}let hasMotion=false;
function applyGravity(x,y){const a=(screen.orientation?.angle??window.orientation??0)*Math.PI/180+Math.PI/2;const nx=clamp(x*Math.cos(a)-y*Math.sin(a),-.38,.38),ny=clamp(x*Math.sin(a)+y*Math.cos(a),-.38,.38);g.x=g.x*.7-nx*.3;g.y=g.y*.7-ny*.3;status.textContent='Tilt control is active';button.hidden=true}
function onMotion(e){const a=e.accelerationIncludingGravity;if(a?.x==null||a?.y==null)return;hasMotion=true;applyGravity(a.x*.035,-a.y*.035)}
function onOrientation(e){if(hasMotion||e.beta==null||e.gamma==null)return;const b=clamp(e.beta,-90,90)*Math.PI/180,c=clamp(e.gamma,-90,90)*Math.PI/180;applyGravity(-Math.sin(c)*.32,-Math.sin(b)*.32)}
button.onclick=async()=>{if(!isSecureContext){status.textContent='Tilt control needs HTTPS.';return}try{const asks=[];if(typeof window.DeviceMotionEvent?.requestPermission==='function')asks.push(DeviceMotionEvent.requestPermission());if(typeof window.DeviceOrientationEvent?.requestPermission==='function')asks.push(DeviceOrientationEvent.requestPermission());if((await Promise.all(asks)).some(x=>x==='denied')){status.textContent='Motion access was not enabled.';return}window.addEventListener('devicemotion',onMotion,{passive:true});window.addEventListener('deviceorientation',onOrientation,{passive:true});status.textContent='Move your iPad to begin';button.disabled=true;setTimeout(()=>{if(!button.hidden){button.disabled=false;status.textContent='No sensor data received. Stars will fall normally.'}},3000)}catch{button.disabled=false;status.textContent='Motion access was not enabled.'}};
function render(){boxes.forEach(b=>b.stop());boxes=[];app.replaceChildren();for(const year of [2023,2025]){let i=year===2023?1:2,s=document.createElement('section');s.innerHTML='<div class="head"><h2>'+year+'</h2><div class="sort"><button data-sort="0">by alphabetical order</button><button data-sort="1">by numerical order</button></div></div><div class="grid"></div><p class="note">✦ One star represents approximately 1% of businesses using AI.'+(year===2025?' <span style="color:#22C55E">✦</span> Green stars show the increase since 2023.':'')+'</p>';app.append(s);s.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',Number(b.dataset.sort)===order[year]);b.onclick=()=>{order[year]=Number(b.dataset.sort);render()}});let rows=[...data];if(order[year])rows.sort((a,b)=>b[i]-a[i]);for(const row of rows){let v=row[i],count=Math.floor(v),baseline=year===2025?Math.min(count,Math.floor(row[1])):count,card=document.createElement('article');card.className='card';card.innerHTML='<div class="box"><canvas aria-label="'+count+' stars for '+row[0]+(year===2025?', '+(count-baseline)+' green stars showing the increase since 2023':'')+'"></canvas></div><div class="value">'+v.toFixed(1)+'%</div><div class="name">'+row[0]+'</div>';s.querySelector('.grid').append(card);boxes.push(new Stars(card.querySelector('canvas'),count,baseline))}}}
class Stars{constructor(canvas,count,baseline){this.baseline=baseline;this.c=canvas;this.ctx=canvas.getContext('2d');this.count=count;this.live=true;this.visible=false;this.io=new IntersectionObserver(a=>this.visible=a[0].isIntersecting,{rootMargin:'150px'});this.io.observe(canvas);this.ro=new ResizeObserver(()=>this.resize());this.ro.observe(canvas);this.resize();this.last=0;this.tick=this.tick.bind(this);this.frame=requestAnimationFrame(this.tick)}resize(){let w=this.c.clientWidth;if(!w)return;this.w=w;this.c.width=w*devicePixelRatio;this.c.height=w*devicePixelRatio;this.ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);this.r=Math.max(6,w*.068);this.stars=Array.from({length:this.count},(_,i)=>({x:this.r+Math.random()*(w-2*this.r),y:-this.r-i*this.r*1.8-Math.random()*w,vx:(Math.random()-.5)*.8,vy:1.2+Math.random()*1.5,delay:i*5}));this.steps=0}stop(){this.live=false;cancelAnimationFrame(this.frame);this.io.disconnect();this.ro.disconnect()}tick(t){if(!this.live)return;this.frame=requestAnimationFrame(this.tick);if(!this.visible)return;let dt=Math.min(2,(t-this.last)/16.67||1);this.last=t;let w=this.w,r=this.r,ctx=this.ctx;ctx.clearRect(0,0,w,w);this.steps++;for(let i=0;i<this.stars.length;i++){let p=this.stars[i];if(this.steps<p.delay)continue;p.vx=clamp((p.vx+g.x*dt)*.997,-5,5);p.vy=clamp((p.vy+(p.y<0?Math.max(g.y,.18):g.y)*dt)*.997,-5,5);p.x+=p.vx*dt;p.y+=p.vy*dt;let edge=r*.84,limit=w-edge;if(p.y>limit||(p.y<edge&&p.y>=0)){p.y=clamp(p.y,edge,limit);p.vy*=-.58;p.vx*=.97}if(p.x<edge||p.x>limit){p.x=clamp(p.x,edge,limit);p.vx*=-.65;p.vy=clamp(p.vy+(Math.random()-.5)*.22,-2.5,2.5)}for(let j=0;j<i;j++){let o=this.stars[j],dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy),min=r*1.38;if(d>0&&d<min){let nx=dx/d,ny=dy/d,shift=(min-d)/2;p.x+=nx*shift;o.x-=nx*shift;p.y+=ny*shift;o.y-=ny*shift;let rel=(p.vx-o.vx)*nx+(p.vy-o.vy)*ny;if(rel<0){let impulse=-rel*.56;p.vx+=impulse*nx;p.vy+=impulse*ny;o.vx-=impulse*nx;o.vy-=impulse*ny}let scatter=(Math.random()-.5)*.3;p.vx-=ny*scatter;p.vy+=nx*scatter;o.vx+=ny*scatter;o.vy-=nx*scatter}}if(p.y>-r){let art=i<this.baseline?starArt.white:starArt.green;if(art.complete&&art.naturalWidth)ctx.drawImage(art,p.x-r,p.y-r,r*2,r*2)}}}}
render();
</script></html>
