<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Usage in businesses by industries</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anonymous+Pro&family=Inter:wght@600&display=swap');
:root{font-family:'Anonymous Pro',monospace;color:#080808;background:#fff;color-scheme:light}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff}
main{max-width:1440px;margin:auto;padding:140px 67px 0}
h1,h2{font-family:Inter,Arial,sans-serif;letter-spacing:-.09em;line-height:1;font-weight:600;margin:0}
h1{font-size:clamp(60px,8.9vw,128px);margin-bottom:135px}
h2{font-size:clamp(70px,8.9vw,128px);position:relative;white-space:nowrap;height:1em;overflow:hidden}
.y{display:block}.y25{position:absolute;left:0;top:0}
.scrolly{position:relative}
.pin{background:#fff;padding:0 0 40px}
.scrolly.pinned .pin{position:sticky;top:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px 0 28px}
.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:46px}
.sort button{font:24px 'Anonymous Pro',monospace;background:#fff;border:0;border-bottom:1px solid #bbb;padding:0 14px 12px;cursor:pointer}
.sort button.active{border-bottom:6px solid #0052fe;padding-bottom:7px}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:40px 16px}
.card{text-align:center;min-width:0}
.box{aspect-ratio:1;background:#0052fe;border-radius:18px;overflow:hidden}
.box canvas{display:block;width:100%;height:100%}
.value{font-size:20px;margin:13px 0 8px}
.namewrap{position:relative;min-height:37px}
.name{position:absolute;left:0;right:0;top:0;font-size:16px;line-height:1.15;overflow-wrap:anywhere;background:#fff;border-radius:8px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;cursor:default}
.name:hover,.name:focus{-webkit-line-clamp:99;line-clamp:99;overflow:visible;z-index:5;padding:2px 6px 7px;box-shadow:0 8px 20px rgba(0,0,0,.16);outline:none}
.motion{display:flex;align-items:center;gap:15px;margin:-75px 0 60px;font-size:17px}
.motion button{font:inherit;color:white;background:#0052fe;border:0;border-radius:99px;padding:14px 20px;cursor:pointer}
.motion button[hidden]{display:none}
.note{margin-top:26px;font-size:17px;color:#555}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.tail{height:120px}
@media(max-width:1100px){main{padding:75px 30px 0}.grid{grid-template-columns:repeat(5,1fr)}.head{align-items:start;flex-direction:column}.value,.sort button{font-size:18px}}
@media(max-width:650px){main{padding:55px 20px 0}.grid{grid-template-columns:repeat(3,1fr);gap:28px 10px}.box{border-radius:12px}.value{font-size:14px;margin:9px 0 6px}.name{font-size:13px}.namewrap{min-height:31px}.sort button{font-size:14px;padding:0 7px 8px}.sort button.active{padding-bottom:3px}h1{font-size:57px;margin-bottom:100px}h2{font-size:72px}.motion{flex-direction:column;align-items:start;margin:-65px 0 50px;font-size:15px}.head{margin-bottom:30px}}
/* Pinning is applied by script (class .pinned) only when the grid actually fits the viewport. */
</style>
<main><h1>AI Usage in businesses<br>by industries</h1><div class="motion"><button id="tilt" type="button">Enable tilt control</button><span id="status" role="status">Tilt your device to move the stars.</span></div><div id="app"></div></main><div class="tail"></div>
<script>
const data=[['Accommodation and Food Services',1.4,2],['Administrative and Support and Waste Management and Remediation Services',2.9,10.2],['Arts, Entertainment, and Recreation',4.1,6],['Construction',1,4.5],['Educational Services',5.9,17.3],['Finance and Insurance',4.7,17.1],['Health Care and Social Assistance',3.7,11.4],['Information Technology',13.9,29.3],['Manufacturing',1.8,4.6],['Other Services',1.9,4],['Professional, Scientific, and Technical Services',8.9,23.9],['Real Estate and Rental and Leasing',6.5,14.6],['Retail Trade',2.6,6.3],['Transportation and Warehousing',1.8,2.1],['Wholesale Trade',1.5,5.4]];
const starArt={white:new Image(),green:new Image()};starArt.white.src='dithered-star-white.svg';starArt.green.src='dithered-star-green.svg';
const app=document.getElementById('app'),button=document.getElementById('tilt'),status=document.getElementById('status'),g={x:0,y:.19};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const artReady=Promise.all([starArt.white,starArt.green].map(img=>img.complete&&img.naturalWidth?null:new Promise(done=>{img.onload=done;img.onerror=done})));
const reduceQuery=matchMedia('(prefers-reduced-motion: reduce)');
let reduceMotion=reduceQuery.matches,tiltActive=false,sortMode=0,progress=0,cards=[],scrolly=null,y23=null,y25=null;

/* ---- tilt ---- */
if(!('DeviceOrientationEvent' in window)){button.hidden=true;status.textContent=reduceMotion?'Stars are shown settled, matching your reduced-motion setting.':'Stars fall automatically on this device.'}
else if(reduceMotion)status.textContent='Stars are shown settled, matching your reduced-motion setting. Enable tilt control to move them.';
let hasMotion=false;
function applyGravity(x,y){const a=(screen.orientation?.angle??window.orientation??0)*Math.PI/180+Math.PI/2;const nx=clamp(x*Math.cos(a)-y*Math.sin(a),-.38,.38),ny=clamp(x*Math.sin(a)+y*Math.cos(a),-.38,.38);g.x=g.x*.7-nx*.3;g.y=g.y*.7-ny*.3;status.textContent='Tilt control is active';button.hidden=true}
function onMotion(e){const a=e.accelerationIncludingGravity;if(a?.x==null||a?.y==null)return;hasMotion=true;applyGravity(a.x*.035,-a.y*.035)}
function onOrientation(e){if(hasMotion||e.beta==null||e.gamma==null)return;const b=clamp(e.beta,-90,90)*Math.PI/180,c=clamp(e.gamma,-90,90)*Math.PI/180;applyGravity(-Math.sin(c)*.32,-Math.sin(b)*.32)}
function resumeMotion(){if(!reduceMotion)return;reduceMotion=false;render()}
button.onclick=async()=>{if(!isSecureContext){status.textContent='Tilt control needs HTTPS.';return}try{const asks=[];if(typeof window.DeviceMotionEvent?.requestPermission==='function')asks.push(DeviceMotionEvent.requestPermission());if(typeof window.DeviceOrientationEvent?.requestPermission==='function')asks.push(DeviceOrientationEvent.requestPermission());if((await Promise.all(asks)).some(x=>x==='denied')){status.textContent='Motion access was not enabled.';return}window.addEventListener('devicemotion',onMotion,{passive:true});window.addEventListener('deviceorientation',onOrientation,{passive:true});tiltActive=true;resumeMotion();status.textContent='Move your iPad to begin';button.disabled=true;setTimeout(()=>{if(!button.hidden){button.disabled=false;status.textContent='No sensor data received. Stars will fall normally.'}},3000)}catch{button.disabled=false;status.textContent='Motion access was not enabled.'}};
reduceQuery.addEventListener('change',e=>{reduceMotion=e.matches&&!tiltActive;render()});

/* ---- build ---- */
function render(){
  cards.forEach(c=>c.stars.stop());cards=[];
  app.replaceChildren();
  const s=document.createElement('section');s.className='scrolly';
  s.innerHTML='<div class="pin"><div class="head"><h2>'+(reduceMotion?'<span class="y">2023 &rarr; 2025</span>':'<span class="y y23">2023</span><span class="y y25">2025</span>')+'</h2><div class="sort" role="group" aria-label="Sort industries"><button type="button" data-sort="0">by alphabetical order</button><button type="button" data-sort="1">by numerical order</button></div></div><div class="grid"></div><p class="note">&#10022; One star represents approximately 1% of businesses using AI. <span style="color:#22C55E">&#10022;</span> Green stars drop in as you scroll, showing the increase from 2023 to 2025.</p></div>';
  app.append(s);
  scrolly=s;y23=s.querySelector('.y23');y25=s.querySelector('.y25');
  s.querySelectorAll('.sort button').forEach(b=>{
    const on=Number(b.dataset.sort)===sortMode;
    b.classList.toggle('active',on);b.setAttribute('aria-pressed',on);
    b.onclick=()=>{sortMode=Number(b.dataset.sort);render()};
  });
  const grid=s.querySelector('.grid');
  let rows=[...data];if(sortMode)rows.sort((a,b)=>b[2]-a[2]);
  for(const row of rows){
    const name=row[0],v23=row[1],v25=row[2];
    const white=Math.min(Math.floor(v23),Math.floor(v25)),green=Math.max(0,Math.floor(v25)-white);
    const card=document.createElement('article');card.className='card';
    card.innerHTML='<div class="box"><canvas aria-hidden="true"></canvas></div><span class="sr"></span><div class="value" aria-hidden="true"></div><div class="namewrap"><div class="name" tabindex="0" aria-hidden="true"></div></div>';
    card.querySelector('.sr').textContent=name+': '+v23.toFixed(1)+'% of businesses in 2023, '+v25.toFixed(1)+'% in 2025.';
    const nameEl=card.querySelector('.name');nameEl.textContent=name;nameEl.title=name;
    grid.append(card);
    cards.push({v23,v25,valueEl:card.querySelector('.value'),stars:new Stars(card.querySelector('canvas'),white,green)});
  }
  apply(reduceMotion?1:progress);
  if(!reduceMotion){layout();measure()}
}

/* ---- scroll choreography ---- */
function apply(p){
  if(y23){
    /* Roll 2023 up and 2025 in from below over a short window, so the two
       numerals never sit on top of each other half-faded. */
    const t=clamp((p-.4)/.2,0,1);
    y23.style.transform='translateY('+(-100*t)+'%)';
    y25.style.transform='translateY('+(100*(1-t))+'%)';
  }
  for(const c of cards){
    c.valueEl.textContent=(c.v23+(c.v25-c.v23)*p).toFixed(1)+'%';
    c.stars.setGreen(Math.round(p*c.stars.green));
  }
}
const DROP=1800,MIN_RANGE=500;
/* Pin the grid only when it genuinely fits the viewport; otherwise let the section
   scroll normally but guarantee enough travel that the green stars ease in. */
function layout(){
  if(!scrolly||reduceMotion)return;
  const pin=scrolly.querySelector('.pin');
  scrolly.classList.remove('pinned');scrolly.style.height='';scrolly.style.minHeight='';
  if(innerWidth>900&&pin.offsetHeight<=innerHeight-8){
    scrolly.classList.add('pinned');
    scrolly.style.height=(innerHeight+DROP)+'px';
  }else scrolly.style.minHeight=(innerHeight+MIN_RANGE)+'px';
}
function measure(){
  if(!scrolly)return;
  const range=scrolly.offsetHeight-innerHeight;
  progress=range>0?clamp((scrollY-scrolly.offsetTop)/range,0,1):(scrollY>scrolly.offsetTop?1:0);
  apply(progress);
}
let ticking=false;
function onScroll(){if(reduceMotion||ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;measure()})}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{layout();onScroll()});

/* ---- stars ---- */
class Stars{
  constructor(canvas,white,green){
    this.c=canvas;this.ctx=canvas.getContext('2d');
    this.white=white;this.green=green;this.count=white+green;this.released=0;
    this.live=true;this.visible=false;this.frame=0;this.last=0;this.w=0;
    this.tick=this.tick.bind(this);
    this.io=new IntersectionObserver(a=>this.visible=a[0].isIntersecting,{rootMargin:'150px'});this.io.observe(canvas);
    this.ro=new ResizeObserver(()=>this.resize());this.ro.observe(canvas);
    this.resize();this.start();
  }
  start(){if(this.frame||!this.live||reduceMotion)return;this.last=0;this.frame=requestAnimationFrame(this.tick)}
  stop(){this.live=false;cancelAnimationFrame(this.frame);this.frame=0;this.io.disconnect();this.ro.disconnect()}
  resize(){
    const w=this.c.clientWidth;if(!w||w===this.w)return;
    this.w=w;this.c.width=w*devicePixelRatio;this.c.height=w*devicePixelRatio;
    this.ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    this.r=Math.max(5,w*.068);
    this.stars=Array.from({length:this.count},(_,i)=>({
      x:this.r+Math.random()*(w-2*this.r),
      y:-this.r-i*this.r*1.8-Math.random()*w,
      vx:(Math.random()-.5)*.8,vy:1.2+Math.random()*1.5,
      delay:i*5,held:i>=this.white}));
    this.steps=0;
    const keep=this.released;this.released=0;this.setGreen(reduceMotion?this.green:keep);
    if(reduceMotion)this.settle();
  }
  launch(p){const w=this.w,r=this.r;p.x=r+Math.random()*(w-2*r);p.y=-r-Math.random()*w*.6;p.vx=(Math.random()-.5)*.8;p.vy=1.2+Math.random()*1.5;p.delay=0;p.held=false}
  setGreen(n){
    if(!this.stars)return;
    n=clamp(n,0,this.green);
    if(n===this.released)return;
    for(let k=0;k<this.green;k++){
      const p=this.stars[this.white+k];
      if(k<n){if(p.held)this.launch(p)}else p.held=true;
    }
    this.released=n;
    if(reduceMotion)this.settle();
  }
  settle(){for(let n=this.count*5+900;n--;)this.step(1);this.draw();artReady.then(()=>{if(this.live&&reduceMotion)this.draw()})}
  step(dt){
    const w=this.w,r=this.r;this.steps++;
    for(let i=0;i<this.stars.length;i++){
      const p=this.stars[i];
      if(p.held||this.steps<p.delay)continue;
      p.vx=clamp((p.vx+g.x*dt)*.997,-5,5);
      p.vy=clamp((p.vy+(p.y<0?Math.max(g.y,.18):g.y)*dt)*.997,-5,5);
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      const edge=r*.84,limit=w-edge;
      if(p.y>limit||(p.y<edge&&p.y>=0)){p.y=clamp(p.y,edge,limit);p.vy*=-.58;p.vx*=.97}
      if(p.x<edge||p.x>limit){p.x=clamp(p.x,edge,limit);p.vx*=-.65;p.vy=clamp(p.vy+(Math.random()-.5)*.22,-2.5,2.5)}
      for(let j=0;j<i;j++){
        const o=this.stars[j];if(o.held)continue;
        const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy),min=r*1.38;
        if(d>0&&d<min){
          const nx=dx/d,ny=dy/d,shift=(min-d)/2;
          p.x+=nx*shift;o.x-=nx*shift;p.y+=ny*shift;o.y-=ny*shift;
          const rel=(p.vx-o.vx)*nx+(p.vy-o.vy)*ny;
          if(rel<0){const impulse=-rel*.56;p.vx+=impulse*nx;p.vy+=impulse*ny;o.vx-=impulse*nx;o.vy-=impulse*ny}
          const scatter=(Math.random()-.5)*.3;
          p.vx-=ny*scatter;p.vy+=nx*scatter;o.vx+=ny*scatter;o.vy-=nx*scatter;
        }
      }
    }
  }
  draw(){
    const w=this.w,r=this.r,ctx=this.ctx;ctx.clearRect(0,0,w,w);
    for(let i=0;i<this.stars.length;i++){
      const p=this.stars[i];if(p.held||p.y<=-r)continue;
      const art=i<this.white?starArt.white:starArt.green;
      if(art.complete&&art.naturalWidth)ctx.drawImage(art,p.x-r,p.y-r,r*2,r*2);
    }
  }
  tick(t){
    if(!this.live||reduceMotion){this.frame=0;return}
    this.frame=requestAnimationFrame(this.tick);
    if(!this.visible)return;
    const dt=Math.min(2,(t-this.last)/16.67||1);this.last=t;
    this.step(dt);this.draw();
  }
}
render();
</script></html>
